name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [rp2040, host, stm32]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential cppcheck clang-tidy
          if [[ "${{ matrix.platform }}" == "rp2040" ]]; then
            sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          fi
          if [[ "${{ matrix.platform }}" == "stm32" ]]; then
            sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
            # (optionally install stlink/dfu-utils if flashing ever needed)
          fi

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DPICO_BUILD_TESTS=OFF \
            -DPICO_EXCLUDE_PICOTOOL=ON \
            -DPLATFORM=${{ matrix.platform }} \
            $([[ "${{ matrix.platform }}" == "rp2040" ]] && echo "-DCMAKE_TOOLCHAIN_FILE=toolchains/arm-none-eabi.cmake -DPICO_SDK_PATH=$GITHUB_WORKSPACE/third_party/pico-sdk") \
            $([[ "${{ matrix.platform }}" == "stm32" ]] && echo "-DCMAKE_TOOLCHAIN_FILE=toolchains/arm-none-eabi.cmake")

      - name: Build firmware
        run: cmake --build build -- -j$(nproc)

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=all --inconclusive --quiet \
            --std=c11 --language=c \
            --suppress=missingIncludeSystem \
            --force .

      - name: Static analysis (clang-tidy)
        run: |
          clang-tidy --version
          cmake --build build --target tidy || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.platform }}
          path: |
            build/**/*.uf2
            build/**/*.elf
            build/**/*.bin
